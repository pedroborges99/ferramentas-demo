  /* ---------------- stock por artigo e local: polo logístico e lojas */
  const ULT = V.ND - 1, r = V.rng(8080), LOC = ["polo", "seixal", "lisboa", "porto"];
  const stock = {};
  V.artigos.forEach(a => {
    const m = V.artigoMensal(a.ref).tot, u8 = (m[V.NM - 2] + m[V.NM - 1] * 31 / 29) / 61, dia = Math.max(0, u8);
    /* cobertura: a maioria entre 4 e 8 semanas, sempre acima do prazo do fornecedor mais a segurança; poucos casos a tratar */
    const pz = V.prazo(a.forn), u = r(); let cob = Math.max(Math.exp(Math.log(Math.max(42, pz + 30)) + N(r) * .22), pz + 7 + 9);
    if (u < .0018) cob = 0; else if (u < .0115) cob = pz * (.3 + r() * .6); else if (u < .016) cob = pz + 7 + 1 + r() * 5;
    const tot = cob === 0 ? 0 : Math.max(1, Math.round(dia * cob + (dia < .05 ? Math.floor(r() * 4) : 0))), lj = D.lojas.map(() => Math.round(tot * (.06 + r() * .06)));
    stock[a.ref] = { polo: Math.max(0, tot - lj.reduce((s, v) => s + v, 0)), seixal: lj[0], lisboa: lj[1], porto: lj[2], dia };
  });
  V.STOCK = { LOC, de: ref => stock[ref], total: ref => { const s = stock[ref]; return s ? s.polo + s.seixal + s.lisboa + s.porto : 0; } };
})();

</script>
<script>/* app.js */
/* Ferramentas.pt · Plataforma de BI · moldura da demonstração.
   Adaptada da moldura do demo da Transwater (tasks/proposta-transwater/demo/app.js): utilitários, estado (sessionStorage),
   relógio, rotas (#/...), barra lateral, painel lateral, avisos, registo de atividade, permissões por utilizador,
   componentes (FP.ui) e gráficos em SVG (FP.g). As páginas vivem nos outros ficheiros e registam-se em window.VISTAS;
   as ações em window.ACOES (data-acao="ns.nome"). */
"use strict";
window.VISTAS = window.VISTAS || {};
window.ACOES = window.ACOES || {};
window.AVISOS = window.AVISOS || [];
(() => {
  const FP = window.FP = {};
  const DADOS = window.DADOS, V = window.VOL;

  /* ================================================================ utilitários */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const espera = ms => new Promise(r => setTimeout(r, ms));
  const agrupa = i => String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const num = (v, dec = 0) => { const [i, d] = Math.abs(v).toFixed(dec).split("."); return (v < 0 ? "-" : "") + agrupa(i) + (d ? "," + d : ""); };
  const eur = (v, dec = 0) => num(v, dec) + " €";
  /* valor compacto: 1,23 M€ · 245,3 mil € · 812 € */
  const eurC = v => { const a = Math.abs(v); if (a >= 1e6) return num(v / 1e6, 2) + " M€"; if (a >= 1e4) return num(v / 1e3, 1) + " mil €"; return num(v, 0) + " €"; };
  const pct = (v, dec = 1) => num(v * 100, dec) + "%";
  const var_ = v => Math.abs(v) < .0005 ? "0,0%" : (v >= 0 ? "+" : "") + num(v * 100, 1) + "%";
  const pp = v => Math.abs(v) < .0005 ? "0,0 pp" : (v >= 0 ? "+" : "") + num(v * 100, 1) + " pp";
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const plural = (n, um, varios) => `${num(n)} ${n === 1 ? um : varios}`;
  const copia = o => JSON.parse(JSON.stringify(o));
  const pad = n => String(n).padStart(2, "0");
  Object.assign(FP, { $, $$, espera, num, eur, eurC, pct, var_, pp, esc, plural, copia, pad });

  /* ================================================================ relógio: hoje, 30/10/2026, a partir das 09:20 */
  const T0 = Date.now();

    rutAdiar: ds => ui.painel({ titulo: "Adiar o alerta", sub: esc(ds.ref + " " + V.art(ds.ref).n), corpo: ui.bloco("", `<div class="form-u"><label>Durante<select id="ad-dias"><option value="3">3 dias</option><option value="7" selected>7 dias</option><option value="14">14 dias</option></select></label><label>Nota<textarea id="ad-nota" rows="3" placeholder="Por exemplo: o fornecedor confirmou entrega na próxima semana"></textarea></label></div>`), acoes: `<button class="bt primario" type="button" data-acao="q.rutAdiarOk" data-ref="${ds.ref}" id="ad-ok">${ic("check")}Adiar</button><button class="bt" type="button" data-acao="core.fechar">Cancelar</button>` }),
    rutAdiarOk: ds => { FP.rut().adiado[ds.ref] = { dias: +FP.$("#ad-dias").value, nota: FP.$("#ad-nota").value.trim(), quando: FP.agora() }; FP.tic(1); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Adiou o alerta de rutura de ${ds.ref}`, origem: "Ruturas iminentes", resultado: FP.rut().adiado[ds.ref].nota || "Sem nota" }); ui.fecharPainel(); FP.gravar(); FP.redesenhar(); FP.toast("Alerta adiado."); },
    rutDef: () => { const R = FP.rut(), forns = [...new Set(FP.ruturas().map(x => x.a.forn))].sort((a, b) => a.localeCompare(b, "pt")), pvs = FP.prevsVivas().filter(pv => pv.p.ref || (pv.p.fam && !pv.p.loja));
      ui.painel({ titulo: "Definições dos avisos de rutura", largo: false, corpo: ui.bloco("", `<div class="form-u"><label class="interruptor ${R.ativo ? "on" : ""}" style="flex-direction:row"><input type="checkbox" id="rd-ativo" ${R.ativo ? "checked" : ""}> Avisos ligados</label><label>Consumo médio das últimas<select id="rd-jan">${[4, 8, 12].map(w => `<option value="${w}" ${R.janela === w ? "selected" : ""}>${w} semanas</option>`).join("")}</select></label><label>Dias de segurança por omissão<input id="rd-def" type="number" min="0" max="60" value="${R.def}"></label></div>`) +
        ui.bloco("Usar uma previsão guardada em vez da projeção linear", pvs.length ? pvs.map(pv => { const k = pv.p.ref ? "ref:" + pv.p.ref : "fam:" + pv.p.fam; return `<label class="chk-l"><input type="checkbox" data-rdu="${k}" value="${pv.id}" ${R.usar[k] === pv.id ? "checked" : ""}> ${esc(pv.nome)} <span class="t3">(${pv.p.ref ? "artigo " + esc(pv.p.ref) : D.familias[pv.p.fam].c})</span></label>`; }).join("") : `<div class="t3">Ainda sem previsões guardadas de família ou de artigo.</div>`) +
        ui.bloco("Dias de segurança por família", `<div class="defs">${D.ordemFamilias.map(k => `<label><span>${D.familias[k].c}</span><input type="number" min="0" max="60" data-rd="fam" data-k="${k}" placeholder="${R.def}" value="${R.fam[k] ?? ""}"></label>`).join("")}</div>`) +
        ui.bloco("Dias de segurança por fornecedor (sobrepõe a família)", `<div class="defs">${forns.map(k => `<label><span>${esc(k)}</span><input type="number" min="0" max="60" data-rd="forn" data-k="${esc(k)}" placeholder="-" value="${R.forn[k] ?? ""}"></label>`).join("")}</div>`),
        acoes: `<button class="bt primario" type="button" data-acao="q.rutDefOk" id="rd-ok">${ic("check")}Guardar</button><button class="bt" type="button" data-acao="core.fechar">Cancelar</button>` }); },
    rutDefOk: () => { const R = FP.rut(); R.ativo = FP.$("#rd-ativo").checked; R.def = Math.max(0, +FP.$("#rd-def").value || 0); R.janela = +FP.$("#rd-jan").value || 8; R.fam = {}; R.forn = {}; R.usar = {}; FP.$$("[data-rd]").forEach(i => { if (i.value !== "") R[i.dataset.rd][i.dataset.k] = +i.value; }); FP.$$("[data-rdu]").forEach(i => { if (i.checked) R.usar[i.dataset.rdu] = i.value; }); FP.tic(1); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: "Mudou as definições dos avisos de rutura", origem: "Ruturas", resultado: `${R.ativo ? "Ligados" : "Desligados"}, consumo de ${R.janela} semanas, ${R.def} dias de segurança por omissão${Object.keys(R.usar).length ? `, ${Object.keys(R.usar).length} previsões guardadas em uso` : ""}` }); ui.fecharPainel(); FP.gravar(); FP.redesenhar(); FP.toast("Definições guardadas."); },
    excel: ds => { const id = ds.q, x = Q[id].calc(AREAS[Q[id].area].estado()); FP.xlsx(`${Q[id].titulo}.xlsx`, [{ nome: Q[id].titulo, linhas: x.csv || [] }]); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Exportou «${Q[id].titulo}» para Excel`, origem: AREAS[Q[id].area].titulo }); FP.toast("Exportado para Excel."); },
  };
})();

</script>
<script>/* agente.js */
/* Ferramentas.pt · Plataforma de BI · agente de análise, sempre ao lado das páginas de área.
   Responde só sobre o que a pessoa está a ver: os quadros selecionados entram no contexto como etiquetas, e as
   perguntas escritas são lidas contra as entidades da página (canais, meses, famílias, gestores de conta, marcas,
   fornecedores). Quando a pergunta não cabe na página, diz onde está; quando os dados não existem nas
   fontes ligadas, diz que não os tem. Nunca responde a outra pergunta.
   É interpretativo: o que o quadro mostra, o que mudou, porquê (decomposição), o que vigiar e a previsão com o método,
   o erro de backtest e o intervalo. Na demonstração a pergunta é interpretada por regras; na solução final, o modelo
   de linguagem interpreta e escolhe, e os números saem sempre dos quadros e das análises da plataforma.
   Cada resposta com gráfico é um artefacto que se junta a um dashboard. */
"use strict";
(() => {
  const FP = window.FP, ui = FP.ui, g = FP.g, V = window.VOL, D = window.DADOS, P = V.P;
  const { esc, num, eur, eurC, pct, var_, pp, ic } = FP;
  const C = g.COR, QQ = () => FP.Q.quadros, AA = () => FP.Q.areas;
  const AGP = FP.AGP = {};
  const norm = s => ui.norm(s);

  /* ---------------- formatação pela unidade */
  const fmt = (u, v) => u === "eur" ? eurC(v) : u === "eur2" ? eur(v, 2) : u === "pct" ? pct(v) : u === "lh" ? num(v, 1) + " linhas/h" : u === "h" ? num(v, 1) + " h" : num(v, 0);
  const dif = (u, v, a) => u === "pct" ? pp(v - a) : var_(v / a - 1);
  const igual = (u, v, a) => Math.abs(u === "pct" ? v - a : v / a - 1) < .0005;
  const subiu = (u, v, a) => igual(u, v, a) ? "ficou igual" : v >= a ? "subiu" : "desceu";
  const face = c => /^a /.test(c) ? "à " + c.slice(2) : /^o /.test(c) ? "ao " + c.slice(2) : /^os /.test(c) ? "aos " + c.slice(3) : /^as /.test(c) ? "às " + c.slice(3) : "a " + c;
  const proximo = j => j === "dia" ? "Se se mantiver até ao fecho do dia, vale a pena perceber a causa." : j === "mes" ? "Se se repetir no próximo mês, é tendência e não ruído." : "Se se mantiver mais uma semana, é tendência e não ruído.";
  /* "no Porto", "em Lisboa", "no site" */
  const emC = k => ({ seixal: "no Seixal", lisboa: "em Lisboa", porto: "no Porto", online: "no Website", amazon: "na Amazon", export: "na exportação" })[k] || "em " + k;
  const lojaDe = k => ({ seixal: "A loja do Seixal", lisboa: "A loja de Lisboa", porto: "A loja do Porto", online: "O Website", amazon: "A Amazon", export: "A exportação" })[k] || k;
  /* "em outubro", "no último trimestre", "na semana" */
  const emP = n => /^o /.test(n) ? "no " + n.slice(2) : /^a /.test(n) ? "na " + n.slice(2) : /^os /.test(n) ? "nos " + n.slice(3) : /^as /.test(n) ? "nas " + n.slice(3) : "em " + n;
  const barras = (l, f, cor) => g.barrasH(l.map(i => ({ n: i.n, v: Math.abs(i.v), txt: f(i.v), cor: cor ? cor(i) : (i.v >= 0 ? C.verde : C.vermelho) })));

  /* ================================================================ interpretação dos quadros */
  const ITENS = x => (x.ag.itens || x.ag.itensM || []).filter(i => i.a !== undefined);
  const contrib = l => l.map(i => ({ ...i, d: i.v - i.a })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  const temTabela = h => /class="tab"|class="mapa"/.test(h || "");
  const decompMargem = l => { const V1 = l.reduce((s, i) => s + i.v, 0), V0 = l.reduce((s, i) => s + i.a, 0); let mix = 0; const it = l.map(i => { const sh = i.v / V1, sh0 = i.a / V0, taxa = sh * (i.m - i.ma); mix += (sh - sh0) * i.ma; return { ...i, taxa }; }); return { it: it.sort((a, b) => a.taxa - b.taxa), mix, tot: it.reduce((s, i) => s + i.taxa, 0) + mix }; };
  /* acontecimento de preço e custo da família no período (DADOS.eventos) */
  const evento = (fam, f) => { const p = f && f.per ? FP.periodo(f.per) : null; if (!p) return null; const ms = V.mesesDe(p.a, p.b); return (D.eventos || []).find(e => e.fam === fam && ms.includes(e.mi)); };

  const INT = {
    explicar(id, x) {
      const q = QQ()[id], t = x.ag.tot, u = x.ag.unid, iu = x.ag.iu || u, l = (x.ag.itens || x.ag.itensM || []).slice().sort((a, b) => b.v - a.v), tot = l.reduce((s, i) => s + i.v, 0);
      let txt = `«${esc(q.titulo)}», ${esc(t.per)}: <b>${x.valor}</b>${x.sub ? ", " + x.sub : ""}.`, html = "";
      if (x.ag.pr) { txt += ` Método escolhido: ${esc(x.ag.pr.win.n)}, o de menor erro entre ${x.ag.pr.bt.length} candidatos nos últimos 12 meses.`; html = temTabela(x.html) ? barras(x.ag.pr.bt.map(b => ({ n: b.c || b.n, v: b.wape })), v => pct(v), i => i.n === (x.ag.pr.win.c || x.ag.pr.win.n) ? C.verde : C.cinza) : x.html; }
      else if (x.ag.queda) { const d = contrib(ITENS(x)).filter(i => i.d < 0).slice(0, 3); txt += ` As maiores quedas: ${d.map(i => `${esc(i.n)} (${eurC(i.d)}, ${var_(i.v / i.a - 1)})`).join("; ")}.`; html = barras(d.map(i => ({ n: i.n, v: i.d })), v => eurC(v)); }
      else if (x.ag.itensM && u === "pct") { const m = x.ag.itensM.slice().sort((a, b) => b.m - a.m); txt += ` A margem mais alta é a de ${esc(m[0].n)} (${pct(m[0].m)}) e a mais baixa a de ${esc(m[m.length - 1].n)} (${pct(m[m.length - 1].m)}).`; html = barras(m.slice(0, 6).map(i => ({ n: i.n, v: i.m })), v => pct(v), () => C.tinta); }
      else if (l.length > 1 && iu !== "pct" && u !== "lh") { txt += ` O maior é ${esc(l[0].n)} (${fmt(iu, l[0].v)}, ${pct(l[0].v / tot, 0)} do total) e o menor ${esc(l[l.length - 1].n)} (${fmt(iu, l[l.length - 1].v)}).`; html = barras(l.slice(0, 6).map(i => ({ n: i.n, v: i.v })), v => fmt(iu, v), () => C.tinta); }
      else if (l.length > 1) { const o = l; txt += ` O valor mais alto é o de ${esc(o[0].n)} (${fmt(iu, o[0].v)}) e o mais baixo o de ${esc(o[o.length - 1].n)} (${fmt(iu, o[o.length - 1].v)}).`; html = barras(o.slice(0, 6).map(i => ({ n: i.n, v: i.v })), v => fmt(iu, v), () => C.tinta); }
      else html = temTabela(x.html) ? "" : x.html;
      return { titulo: q.titulo, texto: txt, html };
    },
    mudou(id, x) {
      const q = QQ()[id], t = x.ag.tot, u = x.ag.unid;
      if (!t.comp) return null;
      const mg = u === "pct" && x.ag.itensM, base = mg ? x.ag.itensM.map(i => ({ ...i, v: i.m, a: i.ma })) : ITENS(x), uu = mg ? "pct" : (x.ag.iu || u);
      const l = contrib(base), up = l.filter(i => i.d > 0).slice(0, 2), dn = l.filter(i => i.d < 0).slice(0, 2);
      let txt = `Face ${face(esc(t.comp))}, ${u === "pct" ? "o valor" : "o total"} ${subiu(u, t.v, t.a)}: ${fmt(u, t.a)} para <b>${fmt(u, t.v)}</b>${igual(u, t.v, t.a) ? "" : ` (${dif(u, t.v, t.a)})`}.`;
      if (up.length) txt += ` Subiram mais ${up.map(i => `${esc(i.n)} (${dif(uu, i.v, i.a)})`).join(" e ")}.`;
      if (dn.length) txt += ` Desceram mais ${dn.map(i => `${esc(i.n)} (${dif(uu, i.v, i.a)})`).join(" e ")}.`;
      const vis = l.filter(i => uu === "pct" ? Math.abs(i.d) >= .0005 : Math.abs(i.d) > 0).slice(0, 7);
      return { titulo: `${q.titulo}: o que mudou`, texto: txt, html: vis.length ? barras(vis.map(i => ({ n: i.n, v: i.d })), v => uu === "pct" ? pp(v) : (v >= 0 ? "+" : "-") + fmt(uu, Math.abs(v))) : "" };
    },
    porque(id, x, f) {
      const q = QQ()[id], t = x.ag.tot, u = x.ag.unid;
      if (x.ag.itensM && u === "pct") {
        const d = decompMargem(x.ag.itensM), pior = d.it[0], vendas = x.ag.itensM.reduce((s, i) => s + i.v, 0), dEur = (t.v - t.a) * vendas;
        let txt = `A margem passou de ${pct(t.a)} para <b>${pct(t.v)}</b> (${pp(t.v - t.a)}, cerca de ${eurC(Math.abs(dEur))} de margem ${dEur < 0 ? "a menos" : "a mais"} sobre ${eurC(vendas)} de vendas). A margem dentro de cada item explica ${pp(d.tot - d.mix)}; a mudança de peso entre eles explica ${pp(d.mix)}. O maior contributo negativo é <b>${esc(pior.n)}</b> (${pp(pior.taxa)}): margem de ${pct(pior.ma)} para ${pct(pior.m)}, ${eurC(Math.abs((pior.m - pior.ma) * pior.v))} de margem a menos.`;
        const e = pior.k && evento(pior.k, f);
        if (e) txt += ` No PHC, nesse período: preço médio de venda ${var_(e.preco)} (${esc(e.campanha)}) e custo médio ponderado ${var_(e.custo)} (${esc(e.motivo)}). O custo explica cerca de ${pct(e.custo / (e.custo - e.preco), 0)} da descida e o preço o resto.`;
        const it = d.it.filter(i => Math.abs(i.taxa) >= .0005).slice(0, 5).concat(Math.abs(d.mix) >= .0005 ? [{ n: "Mistura", taxa: d.mix }] : []);
        const curto = `O que mais pesou foi ${esc(pior.n.toLowerCase())}, com a margem a passar de ${pct(pior.ma)} para ${pct(pior.m)}${e ? `, por causa da ${esc(e.motivo)} e da ${esc(e.campanha)}` : ""}.`;
        return { curto, titulo: `${q.titulo}: porquê`, texto: txt, html: it.length ? barras(it.map(i => ({ n: i.n, v: i.taxa })), v => pp(v)) : "" };
      }
      const l = contrib(ITENS(x)), iu = x.ag.iu || u;
      if (!l.length || !t.comp) return null;
      const top = l.slice(0, 3), mov = l.reduce((s, z) => s + Math.abs(z.d), 0);
      const txt = `${u === "lh" ? "O ritmo" : "O total"} ${subiu(u, t.v, t.a)}${igual(u, t.v, t.a) ? "" : " " + dif(u, t.v, t.a)} face ${face(esc(t.comp))}. ` + (iu === "lh" || iu === "pct" ? `Os maiores desvios: ${top.map(i => `${esc(i.n)} (${fmt(iu, i.v)} contra ${fmt(iu, i.a)})`).join(", ")}.` : `A diferença vem sobretudo de ${top.map(i => `${esc(i.n)} (${i.d >= 0 ? "+" : "-"}${fmt(iu, Math.abs(i.d))}, ${pct(Math.abs(i.d) / Math.max(1e-9, mov), 0)} do movimento)`).join(", ")}.`) + (top[0].extra ? ` ${esc(top[0].n)}: ${esc(top[0].extra)}.` : "");
      return { curto: `Pesou sobretudo ${esc(top[0].n)} (${top[0].d >= 0 ? "+" : "-"}${fmt(iu, Math.abs(top[0].d))}).`, titulo: `${q.titulo}: porquê`, texto: txt, html: barras(top.concat(l.slice(3, 6)).map(i => ({ n: i.n, v: i.d })), v => iu === "pct" ? pp(v) : (v >= 0 ? "+" : "-") + fmt(iu, Math.abs(v))) };
    },
    vigiar(id, x, f) {
      const q = QQ()[id], u = x.ag.unid, iu = x.ag.iu || u, l = ITENS(x), tot = l.reduce((s, i) => s + Math.abs(i.v), 0), jan = x.ag.janela || "semana";
      if (x.ag.pr) { const pr = x.ag.pr, larg = (pr.totHi - pr.totLo) / 2 / pr.tot; return { titulo: `${q.titulo}: o que vigiar`, texto: `Com 80% de confiança, ${esc(x.ag.prevNome)} fica entre ${fmt(u, pr.totLo)} e ${fmt(u, pr.totHi)} (±${pct(larg, 0)}). ${larg > .15 ? "É um intervalo largo: convém encomendar por fases e rever a previsão a meio do mês." : "É um intervalo estreito: a encomenda pode seguir a previsão central."} O método ${esc(pr.win.n)} errou ${pct(pr.win.wape)} por mês no backtest. Se o mês correr fora do intervalo, aparece em Precisão das previsões.`, html: "" }; }
      if (x.ag.forn) {
        /* prazo de entrega: até quando se encomenda a procura de cada mês */
        const hoje = Date.UTC(2026, 9, 30), dd = t => { const d = new Date(t); return `${FP.pad(d.getUTCDate())}/${FP.pad(d.getUTCMonth() + 1)}`; };
        const top = l.slice().sort((a, b) => b.v - a.v).slice(0, 4).map(i => { const mesV = (x.ag.mesesV || {})[i.n] || i.v / 3; let m = 1, lim; do { lim = Date.UTC(2026, 10 + m - 1, 1) - i.prazo * 864e5; m++; } while (lim < hoje && m < 14); return { ...i, mes: V.mesFut(V.NM + m - 2).n, lim: dd(lim), mesV }; });
        return { titulo: `${q.titulo}: o que vigiar`, texto: `Os prazos de entrega mandam no calendário das encomendas: ${top.map(i => `<b>${esc(i.n)}</b>, com ${i.prazo} dias de prazo, tem de receber a encomenda da procura de ${i.mes} até ${i.lim} (cerca de ${eurC(i.mesV)} a custo)`).join("; ")}. A quantidade a encomendar é a procura menos o stock em armazém, que está no quadro Ruturas iminentes.`, html: barras(top.map(i => ({ n: i.n, v: i.prazo })), v => num(v) + " dias", () => C.tinta) };
      }
      if (x.ag.itensM && u === "pct") { const r2 = x.ag.itensM.filter(i => i.m - i.ma < -.01 && i.v > tot * .03).sort((a, b) => (a.m - a.ma) - (b.m - b.ma)).slice(0, 3);
        if (!r2.length) return { curto: "", titulo: `${q.titulo}: o que vigiar`, texto: "Nenhuma margem caiu mais de 1 ponto face ao ano anterior.", html: "" };
        return { curto: `A vigiar: ${r2.map(i => `${esc(i.n.toLowerCase())} (${pp(i.m - i.ma)})`).join(", ")}.`, titulo: `${q.titulo}: o que vigiar`, texto: `A vigiar, margens que caíram mais de 1 ponto: ${r2.map(i => `<b>${esc(i.n)}</b> (${pct(i.ma)} para ${pct(i.m)}, ${pp(i.m - i.ma)})`).join("; ")}. Convém confirmar com Compras se houve subidas de tabela dos fornecedores ou campanhas no período.`, html: barras(r2.map(i => ({ n: i.n, v: i.m - i.ma })), v => pp(v)) }; }
      if (id === "b-risco") { const top = ITENS(x).slice(0, 3); return { curto: "", titulo: `${q.titulo}: o que vigiar`, texto: top.length ? `As contas paradas que mais pesam: ${top.map(i => `<b>${esc(i.n)}</b> (${eurC(i.v)} nos 12 meses anteriores, ${esc(i.extra)})`).join("; ")}. Vale a pena o gestor de cada uma ligar esta semana, antes de a conta passar a comprar noutro lado.` : "Nenhuma conta parada.", html: barras(top.map(i => ({ n: i.n, v: i.v })), v => eurC(v), () => C.vermelho) }; }
      const inv = id === "g-erros", lim = x.ag.limiar ?? -.05;
      const r = l.filter(i => i.a > 0 && Math.abs(i.v) / Math.max(1e-9, tot) > .02).map(i => ({ ...i, r: i.v / i.a - 1 })).filter(i => inv ? i.r > .3 : i.r < lim).sort((a, b) => inv ? b.r - a.r : a.r - b.r).slice(0, 3);
      if (!r.length) return { titulo: `${q.titulo}: o que vigiar`, texto: `Nada fora do normal em «${esc(q.titulo)}»: ${x.valor}${x.sub ? ", " + x.sub : ""}.`, html: "" };
      const quem = iu === "lh" ? "abaixo de 85% da própria média" : inv ? "com mais erros do que a média" : "mais abaixo do habitual";
      const txt = `A vigiar, ${quem}: ${r.map(i => `<b>${esc(i.n)}</b> (${fmt(iu, i.v)} contra ${fmt(iu, i.a)}, ${var_(i.r)})`).join("; ")}.${r[0].extra ? ` ${esc(r[0].n)}: ${esc(r[0].extra)}.` : ""} ${iu === "lh" ? "Antes de concluir, confirmar no Generix se teve mais tarefas de receção ou expedição nesse dia." : proximo(jan)}`;

    avUsar: ds => { const m = todasMsgs().find(x => x.id === ds.m); if (!m || m.feito) return; const p = { fam: m.p.fam, loja: m.p.loja, ref: m.p.ref, h: m.h, k: ds.k, cands: m.cands };
      if (m.nova) { const sug = `${nomeAv(m.p).replace(/^./, c => c.toUpperCase())}, ${m.h === 1 ? "próximo mês" : m.h === 3 ? "próximo trimestre" : "próximo ano"}`;

      m.feito = true; m.usado = ds.k;
      if (m.dash) { const d = FP.S.dash.find(x => x.id === m.dash), r = AD.prevAv.calc(p), a = novoArtefacto({ ad: "prevAv", p, f: {}, titulo: r.titulo }, "compras"), ps = FP.DASH.paginas(d), cr = FP.S.ag.criar && FP.S.ag.criar.d === d.id ? FP.S.ag.criar : { pg: FP.DASH.pagAtual(d).id }, pg = ps.find(x => x.id === cr.pg) || ps[0];
        if (cr.substituir !== undefined && pg.itens[cr.substituir]) pg.itens[cr.substituir].a = a.id; else FP.DASH.colocar(pg, { a: a.id, w: 2, h: 1 }, cr.x, cr.y); FP.S.ag.criar = null; msgsD(d.id).push({ de: "ag", ok: true, titulo: "Gráfico criado", texto: `Pus «${esc(r.titulo)}» em ${esc(pg.nome)}.` }); FP.gravar(); FP.redesenhar(); return; }
      const area = areaAtual(), r = AD.prevAv.calc(p); msgs(area).push({ de: "ag", id: "M" + Math.floor(Math.random() * 1e9).toString(36), tipo: "resposta", ad: "prevAv", p, f: AA()[area].estado(), titulo: r.titulo }); FP.tic(1); FP.S.x.agRolar = true; FP.gravar(); AGP.render(area); },
    novaPrev: () => { const ar = FP.artLongo(); if (location.hash !== "#/compras") FP.ir("compras"); FP.S.ag.aberto = true; FP.S.ag.novaPrev = true;
      msgs("compras").push({ de: "ag", id: "M" + Math.floor(Math.random() * 1e9).toString(36), tipo: "aviso", titulo: "Nova previsão", texto: "O que quer prever? Para compras, o normal é um artigo (pela referência): o agente vê o histórico e escolhe uma tendência linear quando há pouco, ou um modelo avançado quando o histórico chega. Também pode prever as vendas totais, de um canal ou de uma família. Diga o horizonte: próximo mês, trimestre ou ano.", sugs: [`Artigo ${ar.ref} ${ar.n}, próximo trimestre`, `Artigo ${FP.artCurto().ref} ${FP.artCurto().n}, próximo trimestre`, "Ferramentas elétricas na Loja Porto, próximo trimestre", "Vendas totais, próximo trimestre"] }); FP.S.x.agRolar = true; FP.gravar(); FP.redesenhar(); setTimeout(() => { const t = FP.$("#ag-txt"); if (t) { t.placeholder = "O que quer prever?"; t.focus(); } }, 30); },
    guardarPrev: ds => { const m = todasMsgs().find(x => x.id === ds.m), nome = (FP.$("#pv-nome").value || "").trim(); if (!nome) { FP.toast("Dê um nome à previsão."); return; }
      m.feito = true; m.usado = ds.k; const pv = { id: "PV" + Date.now().toString(36), nome, p: { fam: m.p.fam, loja: m.p.loja, ref: m.p.ref }, h: m.h, k: ds.k, cands: m.cands, por: FP.S.eu, quando: FP.agora(), partilhas: [] }; FP.prevs().push(pv); FP.tic(1);
      msgs("compras").push({ de: "ag", id: "M" + Math.floor(Math.random() * 1e9).toString(36), tipo: "aviso", ok: true, titulo: "Previsão guardada", texto: `Guardei «${esc(nome)}» nas suas previsões, com o método «${esc(OPC[ds.k][0])}».` });

      ui.fecharPainel(); FP.gravar(); FP.ir("previsao/" + pv.id); FP.toast("Previsão guardada."); },
    semCelula: () => { FP.S.ag.criar = null; FP.gravar(); FP.redesenhar(); },
    sug: ds => enviar(ds.t, ds.k, ds.q),
    contexto: ds => AGP.focar(ds.q),
    tirar: ds => { const area = QQ()[ds.q].area; FP.S.ag.chips[area] = AGP.chips(area).filter(x => x !== ds.q); FP.gravar(); FP.redesenhar(); },
    limpar: () => { FP.S.ag.msgs[FP.S.eu + ":" + areaAtual()] = []; FP.gravar(); AGP.render(areaAtual()); },
    ir: ds => { FP.ir(ds.a); },
    metodo: ds => { const m = msgs(areaAtual()).find(x => x.id === ds.m), fontes = m.ad ? ["Cegid PHC Ultimate", "Magento 2.4 (Website)", "Amazon Selling Partner API"].concat(m.ad === "operador" ? ["Generix WMS"] : []) : (QQ()[m.q].calc(m.f).ag.fontes || []);
      ui.painel({ titulo: "Dados e método", sub: esc(m.titulo), corpo: ui.bloco("Fontes", fontes.map(s => `<div class="passo"><span class="c">${ic("check")}</span><span>${esc(s)}</span></div>`).join("")) + ui.bloco("Como responde", `<ul style="font-size:13.5px;margin:0;padding-left:18px"><li>${m.ad ? "Análise nova pedida por escrito, calculada com os mesmos dados dos quadros da página." : `Lê o quadro «${esc(QQ()[m.q].titulo)}» com os filtros da página.`} O agente não produz números próprios.</li><li>${m.int === "porque" ? "Porquê: decomposição da variação pelos itens; na margem, efeito dentro de cada item e efeito de mistura, e o preço e o custo médios do PHC." : m.int === "prever" || m.int === "metodos" || m.ad === "prev" ? "Previsão: método escolhido por backtest em origem móvel nos últimos 12 meses; intervalo a partir dos erros do backtest." : m.int === "vigiar" ? "Vigiar: itens com maior desvio face ao habitual, sem os que pesam menos de 2% do total." : "Leitura do valor, da comparação e dos itens."}</li></ul>`), acoes: `<button class="bt" type="button" data-acao="core.fechar">Fechar</button>` }); },

      const area = areaAtual(), m = msgs(area).find(x => x.id === ds.m), v = (FP.$$("#p-corpo input[name=dsh]").find(x => x.checked) || {}).value;

      FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Adicionou «${a.titulo}» ao dashboard «${d.nome}»`, origem: "Agente de análise", rota: "dashboard/" + d.id });
      ui.fecharPainel(); FP.gravar(); AGP.render(area); FP.toast(`Adicionado a «${esc(d.nome)}».`);

<script>/* dashboards.js */
/* Ferramentas.pt · Plataforma de BI · dashboards e acessos.
   Um dashboard é uma grelha de artefactos criados pelo agente (texto curto e gráfico), cada um com 1 ou 2 colunas de
   largura, que se removem e se reordenam. Exporta-se como relatório em PDF ou para o Power BI. Os artefactos guardam a
   pergunta e os filtros e recalculam-se sempre com os dados do dia.
   A página Acessos diz que áreas cada função vê e se vê margens; o Diretor financeiro gere-a. */
"use strict";
(() => {
  const FP = window.FP, ui = FP.ui, V = window.VOL, D = window.DADOS;
  const { esc, num, ic } = FP;
  const DASH = FP.DASH = {};

  const meus = () => FP.S.dash.filter(d => d.dono === FP.S.eu && !d.apagado);
  const recebidos = () => FP.S.dash.filter(d => !d.apagado && d.dono !== FP.S.eu && (d.partilhas || []).some(p => p.u === FP.S.eu));
  const pPara = d => (d.partilhas || []).find(p => p.u === FP.S.eu);
  const dash = id => FP.S.dash.find(d => d.id === id && !d.apagado);
  const art = id => FP.S.artefactos.find(a => a.id === id);
  DASH.criar = nome => { const d = { id: "D" + (FP.S.dash.length + 1), nome, dono: FP.S.eu, criado: FP.agora(), atualizado: FP.agora(), itens: [], paginas: [{ id: "P1", nome: "Página 1", itens: [] }], partilhas: [] }; FP.S.dash.push(d); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Criou o dashboard «${nome}»`, origem: "Dashboards", rota: "dashboard/" + d.id }); return d; };

  /* ---------------- dashboards de exemplo de cada função, com artefactos do agente */
  FP.SEMEAR.push(() => {
    const ex = [
      ["dfin", "Fecho de outubro", "29/10 18:10", [["v-margem", "porque", { per: "mes" }, 1], ["v-familias", "mudou", { per: "mes" }, 1, 2], ["v-canal", "explicar", { per: "mes" }, 1, 2], ["v-evol", "prever", { per: "ano" }, 2], ["f-mensal", "explicar", { per: "365d", canais: [], gest: "todos" }, 2, 2]]],
      ["dfin", "Margem de abrasivos", "06/10 11:30", [["v-familias", "porque", { per: "mesAnt" }, 2]]],
      ["compras", "Vendas e ruturas", "29/10 15:40", [["v-variacoes", "vigiar", { per: "90d" }, 2], ["v-familias", "explicar", { per: "90d" }, 2], ["c-rut", "explicar", {}, 2, 2]]],
      ["dops", "Semana das lojas", "27/10 08:40", [["v-canal", "vigiar", { per: "7d", canais: ["seixal", "lisboa", "porto"] }, 2], ["v-evol", "mudou", { per: "90d", canais: ["seixal", "lisboa", "porto"] }, 1], ["v-variacoes", "explicar", { per: "7d", canais: ["seixal", "lisboa", "porto"] }, 1]]],
      ["logistica", "Entregas da semana", "29/10 07:40", [["g-ent-atraso", "vigiar", { per: "30d", tr: "todos", orig: "todos", forn: "todos" }, 2], ["g-ent-transp", "mudou", { per: "30d", tr: "todos", orig: "todos", forn: "todos" }, 1, 2], ["g-rec-forn", "explicar", { per: "30d", tr: "todos", orig: "todos", forn: "todos" }, 1, 2]]]
    ];
    ex.forEach(([dono, nome, q, its], i) => {
      const d = { id: "D" + (i + 1), nome, dono, criado: q, atualizado: q, itens: [], partilhas: nome === "Entregas da semana" ? [{ u: "dops", nota: "Atrasos da semana passada, para a reunião de segunda.", quando: "29/10 07:45", lido: false }] : [] };
      its.forEach(([qid, int, f, w, h], j) => { const a = { id: `A${i + 1}${j}`, q: qid, int, f, titulo: "", por: dono, quando: q, area: FP.Q.quadros[qid].area }; FP.S.artefactos.push(a); d.itens.push(h ? { a: a.id, w, h } : { a: a.id, w }); });
      FP.S.dash.push(d);
      FP.registar({ quem: dono, tipo: "utilizador", acao: `Criou o dashboard «${nome}»`, origem: "Dashboards", resultado: `${its.length} artefactos do agente`, rota: "dashboard/" + d.id, quando: q });
    });
  });

  /* o que vai para um mosaico: só o gráfico. Um quadro de uma área entra como o gráfico do quadro; uma análise do agente
     entra só com o gráfico dela */
  const grafico = a => { const Q0 = a.q && FP.Q.quadros[a.q]; if (Q0) { const x = Q0.calc(a.f); return { titulo: Q0.titulo, sub: x.valor ? `${x.valor}${x.sub ? " · " + x.sub : ""}` : x.sub || "", html: x.html || "" }; } const r = FP.AGP.artefacto(a); return { titulo: r.titulo, html: r.html || "" }; };
  DASH.grafico = grafico;
  /* ================================================================ lista */
  VISTAS.dashboards = {
    titulo: "Dashboards", contador: () => recebidos().filter(d => !pPara(d).lido).length || 0,
    render(el) {
      const l = meus().sort((a, b) => FP.tk(b.atualizado) - FP.tk(a.atualizado)), rc = recebidos();
      const cartao = d => `<button type="button" class="dash-c" data-ir="dashboard/${d.id}" id="dash-${d.id}"><b>${esc(d.nome)}</b>${d.dono !== FP.S.eu ? `<span class="de">${FP.ui.av(d.dono)}<span>De <b>${esc(FP.user(d.dono).n)}</b>, ${esc(pPara(d).quando)}${pPara(d).nota ? `<em>«${esc(pPara(d).nota)}»</em>` : ""}</span></span>` : ""}<small>${paginas(d).length > 1 ? paginas(d).length + " páginas · " : ""}${todosItens(d).length} gráficos · ${FP.quando(d.atualizado)}</small>${d.dono !== FP.S.eu && !pPara(d).lido ? ui.tag("novo", "novo") : ""}</button>`;
      ui.cab({ titulo: "Dashboards", sub: "", acoes: `<button class="bt primario" type="button" data-acao="dsh.novo" id="dsh-novo">${ic("mais")}Criar novo dashboard</button>` });
      el.innerHTML = `<div class="sec-tit"><h2>Os meus</h2></div>${l.length ? `<div class="dashs">${l.map(cartao).join("")}</div>` : ui.vazio({ icone: "grafico", titulo: "Ainda sem dashboards", acao: `<button class="bt" type="button" data-acao="dsh.novo">Criar novo dashboard</button>` })}
        <div class="sec-tit" id="partilhados"><h2>Partilhados comigo</h2></div>${rc.length ? `<div class="dashs">${rc.map(cartao).join("")}</div>` : `<div class="t3" style="font-size:13px">Nenhum.</div>`}`;
    }
  };

  /* ================================================================ dashboard: páginas e grelha de 4 colunas
     Cada página tem itens { a: artefacto, x, y, w (1 ou 2 colunas), h (1 ou 2 linhas) }. Em edição, a grelha mostra-se
     ao de leve e cada célula vazia tem um "+" que abre o agente em modo de criação para essa célula. */
  const COLS = 4;
  const paginas = d => { if (!d.paginas) { d.paginas = [{ id: "P1", nome: "Página 1", itens: [] }]; (d.itens || []).forEach(it => DASH.colocar(d.paginas[0], { a: it.a, w: 2, h: it.h || 1 })); } return d.paginas; };
  DASH.paginas = paginas;
  const ocupado = pg => { const o = {}; pg.itens.forEach(it => { for (let i = 0; i < it.w; i++) for (let j = 0; j < it.h; j++) o[(it.x + i) + ":" + (it.y + j)] = it; }); return o; };
  const cabe = (pg, x, y, w, h, sem) => { if (x + w > COLS) return false; const o = ocupado(pg); for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) { const z = o[(x + i) + ":" + (y + j)]; if (z && z !== sem) return false; } return true; };
  DASH.colocar = (pg, it, x, y) => { if (x !== undefined && cabe(pg, x, y, it.w, it.h)) { pg.itens.push({ ...it, x, y }); return; } if (x !== undefined && cabe(pg, x, y, 1, it.h)) { pg.itens.push({ ...it, w: 1, x, y }); return; }
    for (let yy = 0; yy < 60; yy++) for (let xx = 0; xx < COLS; xx++) if (cabe(pg, xx, yy, it.w, it.h)) { pg.itens.push({ ...it, x: xx, y: yy }); return; } };
  DASH.pagAtual = d => { const ps = paginas(d); return ps.find(p => p.id === (FP.S.x.pg || {})[d.id]) || ps[0]; };
  const todosItens = d => paginas(d).flatMap(p => p.itens);
  VISTAS.dashboard = {
    titulo: "Dashboard", tambem: ["dashboards"], agente: true,
    render(el, c) {
      const d = dash(c.params[0]);
      const dono = d && d.dono === FP.S.eu, rec = d && pPara(d);
      if (!d || (!dono && !rec)) { ui.cab({ titulo: "Dashboard", migalha: [["dashboards", "Dashboards"]] }); el.innerHTML = ui.vazio({ icone: "grafico", titulo: "Dashboard não encontrado", acao: `<button class="bt" type="button" data-ir="dashboards">Voltar aos dashboards</button>` }); return; }
      if (rec && !rec.lido) { rec.lido = true; FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Abriu o dashboard partilhado «${d.nome}»`, origem: "Dashboards", rota: "dashboard/" + d.id }); }

    margens: (v, ds) => { FP.S.acessos[ds.u] = { ...(FP.S.acessos[ds.u] || {}), margens: v }; FP.tic(1); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `${v ? "Deu" : "Retirou"} a visibilidade das margens a ${FP.user(ds.u).n}`, origem: "Acessos" }); FP.gravar(); FP.redesenhar(); }

    o.className = "pbi-web"; o.innerHTML = `<div class="pbw-top"><span class="pbw-logo"><i></i><i></i><i></i></span><b>Power BI</b><span class="pbw-sep">|</span><span>Ferramentas.pt · BI</span><span class="pbw-q">${ic("search", "p")}Pesquisar</span><span class="pbw-av">${esc(FP.user(FP.S.eu).ini)}</span><button type="button" class="pbw-x" data-acao="dsh.pbiFechar" id="pbw-fechar">${ic("x", "p")}Voltar à plataforma</button></div>

        acoes: `<button class="bt primario" type="button" data-acao="par.ok" data-t="${ds.t}" data-id="${ds.id}" id="pu-ok">${ic("send")}Partilhar</button><button class="bt" type="button" data-acao="core.fechar">Cancelar</button>` }); },

      if (!us.length) { FP.toast("Escolha pelo menos uma função."); return; }
      o.partilhas = (o.partilhas || []).filter(p => us.includes(p.u)); us.forEach(u => { const p = o.partilhas.find(x => x.u === u), q2 = FP.agora(); if (p) Object.assign(p, { nota, quando: q2, lido: false, email }); else o.partilhas.push({ u, nota, quando: q2, lido: false, email }); });

  };
})();

<script>/* plataforma.js */
/* Ferramentas.pt · Plataforma de BI · páginas da plataforma: Fontes de dados (PHC, Magento, Amazon, Generix, CRM por ligar,

"use strict";
(() => {
  const FP = window.FP, ui = FP.ui, V = window.VOL, D = window.DADOS;
  const { esc, num, ic } = FP;

  /* ================================================================ fontes de dados */
  const FREQ = { hora: "De hora a hora", diaria: "Diária, 07:00", semanal: "Semanal, 2.ª feira", generix: "Diária, 06:30" };
  const proxima = k => { const f = FP.S.sync.freq[k]; if (f === "semanal") return "segunda, 02/11, 07:00"; if (f === "diaria") return k === "generix" ? "amanhã, 06:30" : "amanhã, 07:00"; const [h, m] = FP.hora().split(":").map(Number); return h >= 20 ? "amanhã, 07:00" : "hoje, " + FP.pad(h + 1) + ":00"; };
  let correr = null;
  FP.SEMEAR.push(() => {
    const runs = [];
    const docsDia = i => Math.round(V.total({ a: i, b: i }).n);
    for (let d = 0; d < 12; d++) { const i = V.ND - 1 - d, dt = V.dataC(i); const nd = docsDia(i), on = Math.round(V.total({ a: i, b: i, canais: "online" }).n), az = Math.round(V.total({ a: i, b: i, canais: "amazon" }).n);
      if (d === 0) { ["09:00", "07:00"].forEach((h, j) => runs.push({ q: `30/10 ${h}`, t: j ? "automática" : "automática, de hora a hora", r: [["phc", j ? nd : 41], ["magento", j ? on : 15], ["amazon", j ? az : 3]], ok: true })); runs.push({ q: "30/10 06:30", t: "automática", r: [["generix", V.pickingDia(i).reduce((s, x) => s + x.l, 0)]], ok: true, aviso: "3 linhas de picking sem operador" }); continue; }
      if (V.dias[i].dow !== 0) runs.push({ q: `${dt} 06:30`, t: "automática", r: [["generix", V.pickingDia(i).reduce((s, x) => s + x.l, 0)]], ok: true });
      runs.push({ q: `${V.dataC(i + 1 < V.ND ? i + 1 : i)} 07:00`, t: "automática", r: [["phc", nd], ["magento", on], ["amazon", az]], ok: d !== 6, aviso: d === 6 ? "PHC respondeu com atraso; repetida às 07:20 com sucesso" : "" });
    }
    const chave = q => { const [d, h] = q.split(" "), [dd, mm] = d.split("/"); return mm + dd + h; };
    runs.sort((x, y) => chave(y.q).localeCompare(chave(x.q)));
    FP.S.sync.runs = runs;
    FP.S.sync.qual = {
      q3: { t: "Magento: 1 encomenda faturada sem documento no PHC", d: "Encomenda 100248331, de 28/10. A conciliação volta a tentar na próxima leitura.", fonte: "magento", estado: "resolvido", quando: "29/10 07:00" } };
  });

  VISTAS.fontes = {
    titulo: "Fontes de dados", admin: true,
    render(el) {
      const S = FP.S, F = D.fontes;
      ui.cab({ titulo: "Fontes de dados", sub: "Os sistemas da Ferramentas.pt ligados à plataforma, quando são lidos e o que trouxeram. A leitura também se pode pedir a qualquer momento.",
        acoes: `<span class="estado-sync"><span class="ponto ${correr ? "corre" : ""}"></span>${correr ? "A ler as fontes" : `Última leitura <b>hoje, ${S.sync.ultima}</b>`}</span><button class="bt" type="button" data-acao="pl.historico" id="sync-hist">${ic("atividade")}Histórico de leituras</button><button class="bt primario" type="button" data-acao="pl.atualizar" id="sync-agora" ${correr ? "disabled" : ""}>${ic("refresh")}Atualizar agora</button>` });
      const ult = k => S.sync.runs.find(r => r.r.some(x => x[0] === k));
      const card = (k, icone) => { const f = F[k], u = ult(k), n = u ? u.r.find(x => x[0] === k)[1] : 0;
        return `<div class="cartao fonte-c" id="fonte-${k}"><div class="topo"><span class="ic">${ic(icone)}</span><span class="cr"><b>${esc(f.n)}</b><small>${esc(f.via)}</small></span>${ui.pill("Ligado", "ok")}</div>
          <div class="kv"><span>Módulos</span><span>${esc(f.modulos)}</span><span>Última leitura</span><span>${u ? FP.quando(u.q) : "sem leituras"}${u ? ` · ${num(n)} ${k === "generix" ? "linhas" : k === "magento" || k === "amazon" ? "encomendas" : "documentos"}` : ""}</span><span>Próxima leitura</span><span>${proxima(k)}</span>
            <span>Frequência</span><span><select class="sel" data-mudar="pl.freq" data-k="${k}" aria-label="Frequência">${(k === "generix" ? [["diaria", FREQ.generix], ["semanal", FREQ.semanal]] : [["hora", FREQ.hora], ["diaria", FREQ.diaria], ["semanal", FREQ.semanal]]).map(([v, n]) => `<option value="${v}" ${S.sync.freq[k] === v ? "selected" : ""}>${n}</option>`).join("")}</select></span></div>
          <div class="sub-t" style="margin:4px 0 0">Tabelas lidas</div><div class="chk">${f.tabelas.map(([t, c]) => `<span class="tag" title="${esc(c)}">${esc(t)}</span>`).join("")}</div>
          ${k === "generix" ? `<div class="t3" style="font-size:12px">Em produção desde ${V.dataPT(V.idxIso(D.inicioGenerix))}. As expedições, entregas e receções anteriores foram migradas do sistema anterior na entrada em produção.</div>` : ""}</div>`; };
      el.innerHTML = `${correr ? `<div class="cartao" id="sync-progresso"><div class="cartao-cab"><div><h2>Leitura em curso</h2><div class="h2s">Pedida por ${esc(ui.quem(S.eu))} às ${correr.h}</div></div></div>${correr.passos.map(p => `<div class="passo"><span class="c" ${p.ok ? "" : 'style="background:var(--amarelo-f);color:#7a5b00"'}>${p.ok ? ic("check") : ic("clock")}</span><span>${esc(p.t)}</span></div>`).join("")}</div>` : ""}
        <div class="grelha g2" ${correr ? 'style="margin-top:16px"' : ""}>${card("phc", "base")}${card("magento", "carrinho")}${card("amazon", "caixa")}${card("generix", "camiao")}</div>
        <div class="grelha g2" style="margin-top:16px">
          <div class="cartao fonte-c" id="fonte-crm"><div class="topo"><span class="ic">${ic("users")}</span><span class="cr"><b>${esc(F.crm.n)}</b><small>${esc(F.crm.via)}</small></span>${ui.pill("Ligado", "ok")}</div><div class="kv"><span>Dados</span><span>${esc(F.crm.modulos)}</span><span>Frequência</span><span>${esc(F.crm.freq)}</span><span>Última leitura</span><span>hoje, ${S.sync.ultima}</span><span>Acesso</span><span>${esc(F.crm.acesso)}</span></div><div class="t3" style="font-size:12px">${esc(F.crm.nota)}</div></div></div>`;
    }
  };
  function historicoLeituras() {
    const S = FP.S, fF = ui.fv("hlFonte"), fE = ui.fv("hlEstado"), fT = ui.fv("hlTipo"), q = ui.qv("hlQ").toLowerCase();
    const est = r => !r.ok ? "repetida" : r.aviso ? "aviso" : "ok";
    const todas = S.sync.runs.filter(r => (fF === "todos" || r.r.some(x => x[0] === fF)) && (fE === "todos" || est(r) === fE)
      && (fT === "todos" || (fT === "pedida" ? /pedida/.test(r.t) : !/pedida/.test(r.t)))
      && (!q || `${r.t} ${r.aviso || ""} ${r.r.map(x => D.fontes[x[0]].n).join(" ")}`.toLowerCase().includes(q)));
    const runs = todas.slice(0, ui.limite("runs"));
    const filtros = `<div class="barra-f" style="display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px">${ui.procura("hlQ", "Procurar nas leituras", 200)}${ui.dropdown("hlFonte", "Fonte", [["todos", "Todas"], ["phc", "Cegid PHC"], ["magento", "Magento"], ["amazon", "Amazon"], ["generix", "Generix WMS"]])}${ui.dropdown("hlEstado", "Estado", [["todos", "Todos"], ["ok", "Concluída"], ["aviso", "Concluída com aviso"], ["repetida", "Repetida"]])}${ui.dropdown("hlTipo", "Tipo", [["todos", "Todas"], ["auto", "Automáticas"], ["pedida", "Pedidas"]])}</div>`;
    if (!runs.length) return filtros + ui.vazio({ icone: "atividade", titulo: "Sem leituras com estes filtros" });
    return filtros + `<div class="lista-c">${ui.tabela({ cols: "120px minmax(0,1fr) minmax(0,2fr) 168px", cab: ["Quando", "Tipo", "Resultado", "Estado"], linhas: runs.map(r => ({ classe: FP.S.novos[r.q] ? "novo" : "", celulas: [`<span class="t2 nowrap">${FP.quando(r.q)}</span>`, `<span class="el t2">${esc(r.t)}</span>`, `<span class="res-l"><span class="el">${r.r.map(([k, n]) => `${esc(D.fontes[k].n.split(" ")[k === "phc" ? 1 : 0])}: ${num(n)}`).join(" · ")}</span>${r.aviso ? `<small class="t3">${esc(r.aviso)}</small>` : ""}</span>`, r.ok ? ui.pill(r.aviso ? "Concluída com aviso" : "Concluída", r.aviso ? "val" : "ok") : ui.pill("Repetida", "val")] })) })}${ui.pager("runs", todas.length, runs.length, "leituras")}</div>`;
  }
  async function atualizar() {
    if (correr) return; const S = FP.S; FP.tic(1);
    correr = { h: FP.hora(), passos: [{ t: "Cegid PHC Ultimate: a ler documentos de venda desde as " + S.sync.ultima, ok: false }] }; FP.redesenhar();

    await FP.espera(500);
    S.sync.ultima = FP.hora(); const q = FP.agora(); S.sync.runs.unshift({ q, t: `pedida por ${ui.quem(S.eu)}`, r: [["phc", n1], ["magento", n2], ["amazon", n3]], ok: true }); S.novos[q] = true;
    FP.registar({ quem: S.eu, tipo: "sincronizacao", acao: "Pediu a leitura das fontes de dados", origem: "Fontes de dados", resultado: `PHC: ${n1} documentos; Magento: ${n2} encomendas; Amazon: ${n3} encomendas; Generix: sem alterações` });
    correr = null; FP.gravar(); FP.redesenhar(); FP.toast(`Leitura concluída: ${n1} documentos do PHC, ${n2} encomendas do Magento e ${n3} da Amazon.`);
  }

  /* ================================================================ registo de atividade */
  VISTAS.registo = {
    titulo: "Registo de atividade",
    render(el) {
      const S = FP.S, adm = FP.admin(), q = ui.norm(ui.qv("reg"));
      const base = S.registo.filter(r => adm || r.quem === S.eu || (r.quem === "agente" && /a .+:/.test(r.acao) && r.acao.includes(ui.quem(S.eu)))).slice().sort((a, b) => b.t - a.t || (b.id > a.id ? 1 : -1));

      const rr = ui.filtrar(base.filter(bate), { regQuem: (r, v) => r.quem === v, regTipo: (r, v) => r.tipo === v, regOrig: (r, v) => r.origem === v, regPer: (r, v) => v === "hoje" ? r.quando.startsWith("30/10") : v === "7d" ? r.t >= FP.tk("24/10") : v === "30d" ? r.t >= FP.tk("01/10") : true });
      const mostra = rr.lista.slice(0, ui.limite("reg")), quems = [...new Set(base.map(r => r.quem))], origens = [...new Set(base.map(r => r.origem))].sort((a, b) => a.localeCompare(b, "pt"));
      ui.cab({ titulo: "Registo de atividade", sub: adm ? "Cada ação das pessoas, do agente e das leituras das fontes, com a data, quem a fez, a origem e o resultado." : "As suas ações e as respostas do agente às suas perguntas.",
        acoes: `${ui.procura("reg", "Ação, relatório ou pessoa", 260)}<button class="bt" type="button" data-acao="pl.exportarReg">${ic("descarregar")}Exportar CSV</button>` });
      el.innerHTML = `<div class="barra-f">${ui.dropdown("regQuem", "Quem", [["todos", "Todos", rr.conta("regQuem", "todos")]].concat(quems.map(k => [k, ui.quem(k), rr.conta("regQuem", k)])))}${ui.dropdown("regTipo", "Tipo", [["todos", "Todos", rr.conta("regTipo", "todos")], ["utilizador", "Ações das pessoas", rr.conta("regTipo", "utilizador")], ["agente", "Respostas do agente", rr.conta("regTipo", "agente")], ["sincronizacao", "Leituras e envios", rr.conta("regTipo", "sincronizacao")], ["acesso", "Acessos", rr.conta("regTipo", "acesso")]])}${ui.dropdown("regOrig", "Origem", [["todos", "Todas", rr.conta("regOrig", "todos")]].concat(origens.map(o => [o, o, rr.conta("regOrig", o)])))}${ui.dropdown("regPer", "Período", [["todos", "Sempre", rr.conta("regPer", "todos")], ["hoje", "Hoje", rr.conta("regPer", "hoje")], ["7d", "Últimos 7 dias", rr.conta("regPer", "7d")], ["30d", "Este mês", rr.conta("regPer", "30d")]])}</div>
        <div class="cartao lista-c" id="reg-tabela">${ui.tabela({ cols: "96px minmax(0,1.1fr) minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.5fr)", cab: ["Data", "Quem", "Ação", "Origem", "Resultado"],
          linhas: mostra.map(r => ({ ir: r.rota || "", celulas: [`<span class="t2 nowrap">${FP.quando(r.quando)}</span>`, `<span class="reg-quem">${ui.av(r.quem, "pq")}<span class="el">${esc(ui.quem(r.quem))}</span></span>`, `<div class="el" title="${esc(r.acao)}">${esc(r.acao)}</div>${r.ref ? `<small>${esc(r.ref)}</small>` : ""}`, `<span class="el t2">${esc(r.origem)}</span>`, `<span class="el t2" title="${esc(r.resultado)}">${esc(r.resultado)}</span>`] })),
          vazio: q ? ui.naoEncontrado(ui.qv("reg"), "reg") : ui.vazio({ icone: "atividade", titulo: "Sem registos com estes filtros" }) })}${ui.pager("reg", rr.lista.length, mostra.length, "registos")}</div>`;
    }
  };

  ACOES.pl = {
    historico: () => ui.painel({ titulo: "Histórico de leituras", sub: "Automáticas e pedidas, com o que cada uma trouxe", largo: true, corpo: historicoLeituras(), refazer() { const c = document.querySelector("#p-corpo"); if (c) c.innerHTML = historicoLeituras(); }, acoes: `<button class="bt" type="button" data-acao="core.fechar">Fechar</button>` }),
    atualizar: () => atualizar(),
    freq: (v, ds) => { FP.S.sync.freq[ds.k] = v; FP.tic(1); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Mudou a frequência de leitura de ${D.fontes[ds.k].n}`, origem: "Fontes de dados", resultado: ds.k === "generix" && v === "diaria" ? FREQ.generix : FREQ[v] }); FP.gravar(); FP.redesenhar(); FP.toast("Frequência de leitura atualizada."); },
    qual: ds => { const x = FP.S.sync.qual[ds.id]; x.estado = ds.e; x.por = FP.S.eu; FP.tic(1); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `${ds.e === "aberto" ? "Reabriu" : ds.e === "resolvido" ? "Marcou como resolvido" : "Ignorou"}: ${x.t}`, origem: "Fontes de dados" }); FP.gravar(); FP.redesenhar(); },
    qualVer: ds => { const x = FP.S.sync.qual[ds.id]; ui.painel({ titulo: esc(x.t), sub: `${esc(D.fontes[x.fonte].n)} · ${FP.quando(x.quando)}`, corpo: ui.bloco("", `<div style="font-size:14px">${esc(x.d)}</div>`) + ui.bloco("Registos", ui.tabela({ cols: "minmax(0,1fr) minmax(0,1.4fr)", cab: ["Registo", "Situação"], linhas: (x.fonte === "generix" ? ["88412", "88419", "88433"].map(o => [`Ordem ${o}`, "linha preparada sem operador"]) : x.fonte === "phc" ? [["FS 2026/41877", "sem vendedor, Lisboa"], ["FS 2026/41902", "sem vendedor, Lisboa"]] : [["Encomenda 100248331", "faturada no Magento, sem documento no PHC"]]).map(c => ({ celulas: c })) })),
      acoes: `<button class="bt primario" type="button" data-acao="pl.qual" data-id="${ds.id}" data-e="resolvido">${ic("check")}Resolvido</button><button class="bt" type="button" data-acao="pl.qual" data-id="${ds.id}" data-e="ignorado">Ignorar</button><button class="bt" type="button" data-acao="pl.avisarResp" data-id="${ds.id}">${ic("mail")}Avisar o responsável</button><button class="bt" type="button" data-acao="core.fechar">Fechar</button>` }); },
    avisarResp: ds => { const x = FP.S.sync.qual[ds.id], para = x.fonte === "generix" ? "logistica" : x.fonte === "phc" ? "dops" : "dfin"; FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: `Avisou ${ui.quem(para)}: ${x.t}`, origem: "Fontes de dados", resultado: "Email enviado" }); FP.toast(`Aviso enviado a ${ui.quem(para)}.`); },
    exportarReg: () => { const l = FP.S.registo.slice().sort((a, b) => b.t - a.t); FP.descarregar("registo-de-atividade-2026-10-30.csv", FP.csv([["Data", "Quem", "Tipo", "Ação", "Origem", "Resultado", "Referência"]].concat(l.map(r => [r.quando, ui.quem(r.quem), r.tipo, r.acao, r.origem, r.resultado, r.ref])))); FP.registar({ quem: FP.S.eu, tipo: "utilizador", acao: "Exportou o registo de atividade", origem: "Registo de atividade", resultado: `${num(l.length)} registos em CSV` }); FP.redesenhar(); FP.toast("Registo exportado em CSV."); }
  };
})();

</script>
